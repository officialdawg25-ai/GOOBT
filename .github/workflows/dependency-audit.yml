name: GOOBT dependency audit
on:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches:
      - main
      - 'security/**'
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/dependency-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply compatible audit fixes and report remaining findings
        run: |
          npm audit fix || true
          npm audit --json > npm-audit.json || true
          node -e "const report=require('./npm-audit.json');const findings=report.vulnerabilities||{};console.log('npm audit summary:',JSON.stringify(report.metadata?.vulnerabilities||{}));for(const [name,item] of Object.entries(findings)){console.log(name+' | '+item.severity+' | range='+item.range+' | fix='+JSON.stringify(item.fixAvailable)+' | '+item.via.map(x=>typeof x==='string'?x:x.title).join('; '));}"
      - name: Validate dependency updates before artifact
        run: |
          npm run typecheck
          npm run lint
          npm run test
          npm run build
      - name: Upload lockfile and audit report for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-candidate-${{ github.run_id }}
          path: |
            package.json
            package-lock.json
            npm-audit.json
          retention-days: 7
  persist-lockfile:
    if: startsWith(github.ref, 'refs/heads/security/') && needs.audit.result == 'success'
    needs: audit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: npm-audit-candidate-${{ github.run_id }}
          path: .
      - name: Commit audited package lock to security branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Package lock is already up to date."
            exit 0
          fi
          git commit -m "chore: update audited dependency lockfile"
          git push origin HEAD:${GITHUB_REF_NAME}
