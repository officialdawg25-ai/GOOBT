name: GOOBT dependency audit
on:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/dependency-audit.yml
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply compatible audit fixes and report remaining findings
        run: |
          npm audit fix || true
          npm audit --json > npm-audit.json || true
          node -e "const report=require('./npm-audit.json');const findings=report.vulnerabilities||{};console.log('npm audit summary:',JSON.stringify(report.metadata?.vulnerabilities||{}));for(const [name,item] of Object.entries(findings)){console.log(name+' | '+item.severity+' | range='+item.range+' | fix='+JSON.stringify(item.fixAvailable)+' | '+item.via.map(x=>typeof x==='string'?x:x.title).join('; '));}"
      - name: Validate dependency updates before proposing PR
        run: |
          npm run typecheck
          npm run lint
          npm run test
          npm run build
      - name: Create reviewable dependency update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: security/npm-audit-fix
          commit-message: "chore: apply compatible npm audit fixes"
          title: "chore: apply compatible npm audit fixes"
          body: |
            This PR applies compatible dependency updates from `npm audit fix`.
            No force/major upgrades are requested. The GOOBT CI typecheck, lint, unit tests and build must pass before merge.
            Remaining advisories are reported in the dependency-audit workflow logs. Review the package and lockfile diff before merging.
          add-paths: |
            package.json
            package-lock.json
          delete-branch: true
